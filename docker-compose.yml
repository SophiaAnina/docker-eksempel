services:
  frontend:
    build:
      context: ./washworld_eksame_frontend_2026
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:80
    container_name: washworld_eksamen_frontend
    depends_on:
      - web
    ports:
      - 3000:3000

  web:
    build:
      context: ./washworld_eksamen_backend_2026
      dockerfile: Dockerfile
    container_name: washworld_eksamen_flask
    depends_on:
      - mariadb
    ports:
      - 80:80 # 0 - 1024 reserved. Use any port from 1025 to 65535
    volumes:
      - ./washworld_eksamen_backend_2026:/app

  mariadb:
    image: mariadb:10.6.20
    container_name: washworld_eksamen_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: washworld_eksamen
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - 3306:3306

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: washworld_eksamen_phpmyadmin
    depends_on:
      - mariadb
    environment:
      PMA_HOST: mariadb
      MYSQL_ROOT_PASSWORD: password
    ports:
      - 8080:80

volumes:
  mariadb_data:
    name: backend_mariadb_data # keeps the DB volume created by the old backend-only compose
